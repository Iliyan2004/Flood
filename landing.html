<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SAILAB</title>
<meta name="description" content="SAILAB - Simulation & Analytics for Inundation, Loss, Assets & Built Environment. Flood hazard and impact modelling for Pakistan.">
<meta name="theme-color" content="#04090c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2304131a'/%3E%3Cpath d='M3 21c4-7 7-7 10-2s6 4 9-3c2-4 4-4 7-2v11H3z' fill='%2340d9cf'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100,800..900&family=Archivo+Narrow:wght@500;600&display=swap">
<style>
  :root {
    --ink: #f3fbfa;
    --aqua: #55e6da;
    --aqua-deep: #14a8a0;
    --bg: #04090c;
    --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
    --text: "Archivo Narrow", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--text);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  /* CSS-only sea shown if WebGL is unavailable */
  body.no-gl {
    background:
      radial-gradient(120% 60% at 50% 0%, #1b3a44 0%, transparent 60%),
      linear-gradient(180deg, #2a2420 0%, #16323a 38%, #07181f 70%, #04090c 100%);
  }
  canvas#sea { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .veil {
    position: fixed; inset: 0; pointer-events: none;
    background:
      radial-gradient(60% 46% at 50% 50%, rgba(2, 10, 14, .55) 0%, rgba(2, 10, 14, .25) 55%, transparent 100%),
      radial-gradient(130% 100% at 50% 50%, transparent 55%, rgba(0, 4, 6, .6) 100%);
  }
  main {
    position: relative; z-index: 2;
    min-height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 6vh 20px 10vh;
    text-align: center;
  }
  h1 {
    margin: 0;
    font-family: var(--display);
    font-weight: 900;
    font-stretch: 112%;
    font-size: clamp(3.4rem, 15.5vw, 11.5rem);
    line-height: .92;
    letter-spacing: .05em;
    padding-left: .05em; /* optical centering against trailing letter-spacing */
    color: var(--ink);
    text-shadow: 0 2px 0 rgba(0, 0, 0, .25), 0 10px 60px rgba(0, 12, 16, .75), 0 0 2px rgba(0, 0, 0, .6);
  }
  .full {
    margin: clamp(14px, 2.6vh, 28px) 0 0;
    max-width: 30em;
    font-family: var(--text);
    font-weight: 500;
    font-size: clamp(.95rem, 2.1vw, 1.45rem);
    letter-spacing: .2em;
    text-transform: uppercase;
    line-height: 1.7;
    text-wrap: balance;
    color: rgba(243, 251, 250, .9);
    text-shadow: 0 2px 18px rgba(0, 10, 14, .9), 0 0 3px rgba(0, 0, 0, .7);
  }
  .full b { color: var(--aqua); font-weight: 600; }
  .rule {
    width: min(220px, 40vw); height: 2px; margin: clamp(18px, 3.2vh, 34px) 0 clamp(22px, 4vh, 42px);
    background: linear-gradient(90deg, transparent, var(--aqua), transparent);
    opacity: .8;
  }
  .open {
    --glow: rgba(85, 230, 218, .45);
    appearance: none; text-decoration: none; cursor: pointer;
    display: inline-flex; align-items: center; gap: .8em;
    padding: 1.05em 2.3em 1.05em 2.5em;
    font-family: var(--display); font-weight: 800; font-stretch: 105%;
    font-size: clamp(.95rem, 1.7vw, 1.15rem);
    letter-spacing: .18em; text-transform: uppercase;
    color: var(--ink);
    background: rgba(8, 28, 34, .5);
    -webkit-backdrop-filter: blur(10px) saturate(1.3); backdrop-filter: blur(10px) saturate(1.3);
    border: 1.5px solid rgba(85, 230, 218, .75);
    border-radius: 999px;
    box-shadow: 0 0 0 0 var(--glow), 0 10px 40px rgba(0, 0, 0, .45), inset 0 0 22px rgba(85, 230, 218, .12);
    transition: transform .25s cubic-bezier(.2, .8, .2, 1), background .25s, color .25s, box-shadow .35s;
    animation: pulse 3.2s ease-in-out infinite;
  }
  .open svg { width: 1.25em; height: 1.25em; transition: transform .3s cubic-bezier(.2, .8, .2, 1); }
  .open:hover, .open:focus-visible {
    transform: translateY(-2px);
    background: linear-gradient(135deg, var(--aqua), var(--aqua-deep));
    color: #03161a;
    box-shadow: 0 0 46px 6px var(--glow), 0 14px 44px rgba(0, 0, 0, .5);
    animation: none;
  }
  .open:hover svg, .open:focus-visible svg { transform: translateX(5px); }
  .open:active { transform: translateY(0) scale(.98); }
  .open:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(85, 230, 218, .0), 0 10px 40px rgba(0, 0, 0, .45), inset 0 0 22px rgba(85, 230, 218, .12); }
    50%      { box-shadow: 0 0 34px 2px rgba(85, 230, 218, .38), 0 10px 40px rgba(0, 0, 0, .45), inset 0 0 22px rgba(85, 230, 218, .12); }
  }
  .meta {
    position: fixed; z-index: 2; left: 0; right: 0; bottom: max(16px, env(safe-area-inset-bottom));
    text-align: center; font-size: .82rem; letter-spacing: .22em; text-transform: uppercase;
    color: rgba(243, 251, 250, .55); text-shadow: 0 1px 10px rgba(0, 0, 0, .9);
  }
  .rise > * { opacity: 0; transform: translateY(18px); animation: rise .9s cubic-bezier(.2, .8, .2, 1) forwards; }
  .rise > :nth-child(1) { animation-delay: .15s; }
  .rise > :nth-child(2) { animation-delay: .4s; }
  .rise > :nth-child(3) { animation-delay: .6s; }
  .rise > :nth-child(4) { animation-delay: .75s; }
  @keyframes rise { to { opacity: 1; transform: none; } }
  .flash {
    position: fixed; inset: 0; z-index: 5; pointer-events: none; opacity: 0;
    background: radial-gradient(circle at 50% 55%, #d9fffb 0%, #6fd9d2 35%, #0b3b42 100%);
  }
  @media (prefers-reduced-motion: reduce) {
    .rise > * { animation: none; opacity: 1; transform: none; }
    .open { animation: none; }
  }
  @media (max-height: 520px) { h1 { font-size: clamp(2.6rem, 11vw, 6rem); } .rule { margin: 10px 0 16px; } }
</style>
</head>
<body>
<canvas id="sea" aria-hidden="true"></canvas>
<div class="veil" aria-hidden="true"></div>
<div class="flash" id="flash" aria-hidden="true"></div>

<main>
  <div class="rise" style="display:contents">
    <h1>SAILAB</h1>
    <p class="full"><b>S</b>imulation &amp; <b>A</b>nalytics for <b>I</b>nundation, <b>L</b>oss, <b>A</b>ssets &amp; <b>B</b>uilt Environment</p>
    <div class="rule" aria-hidden="true"></div>
    <a class="open" id="open" href="/app">
      Open SAILAB
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h15M13 5l7 7-7 7"/></svg>
    </a>
  </div>
</main>
<div class="meta">Flood intelligence for Pakistan &middot; v__APP_VERSION__</div>

<script>
(function () {
  "use strict";
  var link = document.getElementById("open");
  var flash = document.getElementById("flash");
  var canvas = document.getElementById("sea");
  var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  // keep any query string (for example ?import=<id> from SimCity) when entering the app
  link.href = "/app" + location.search;

  var VERT = "attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}";
  var FRAG = [
"precision highp float;",
"uniform vec2 uRes; uniform float uTime; uniform float uFront; uniform vec2 uMouse;",
"const vec3 L = vec3(-0.30, 0.46, 0.83);",
"float hash(vec2 p){ p = fract(p*vec2(123.34, 456.21)); p += dot(p, p+45.32); return fract(p.x*p.y); }",
"float noise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);",
"  return mix(mix(hash(i),hash(i+vec2(1,0)),f.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x), f.y); }",
"float fbm3(vec2 p){ float a=.5,s=0.; for(int i=0;i<3;i++){ s+=a*noise(p); p=p*2.03+vec2(7.1,3.7); a*=.5; } return s; }",
"float fbm5(vec2 p){ float a=.5,s=0.; for(int i=0;i<5;i++){ s+=a*noise(p); p=p*2.03+vec2(7.1,3.7); a*=.5; } return s; }",
"float frontZ(float x){ return uFront + 2.6*sin(x*0.10+0.7) + 3.0*noise(vec2(x*0.16,3.0)) + 0.9*sin(x*0.31+uTime*0.15); }",
"float bigWave(vec2 p){",
"  float d = max(p.y - frontZ(p.x), 0.0);",
"  float rise = 1.0 - exp(-d/1.5);",
"  float tail = exp(-max(d-2.2, 0.0)/12.0);",
"  float H = 12.8*(0.78 + 0.45*noise(vec2(p.x*0.07, 1.7)));",
"  return H*rise*tail;",
"}",
"float chop3(vec2 p){ return (fbm3(vec2(p.x*0.6, p.y*0.9 + uTime*1.8)) - 0.5)*1.1; }",
"float hM(vec2 p){ return bigWave(p) + chop3(p); }",
"float hF(vec2 p){",
"  float d = p.y - frontZ(p.x);",
"  float rise = 1.0 - exp(-max(d,0.)/1.5);",
"  float streak = (noise(vec2(p.x*0.9, d*0.12 - uTime*0.6)) - 0.5)*1.1*rise;",
"  float fine = (fbm5(vec2(p.x*1.9, p.y*2.3 + uTime*2.4)) - 0.5)*0.35;",
"  return bigWave(p) + chop3(p) + streak + fine;",
"}",
"vec3 sky(vec3 d){",
"  float y = clamp(d.y, 0., 1.);",
"  vec3 hor = vec3(0.74, 0.40, 0.26), mid = vec3(0.10, 0.17, 0.22), top = vec3(0.012, 0.028, 0.055);",
"  vec3 c = mix(hor, mid, smoothstep(0., 0.22, y)); c = mix(c, top, smoothstep(0.18, 0.85, y));",
"  vec2 cp = d.xz/(d.y+0.18)*0.55 + vec2(uTime*0.012, 0.);",
"  float cl = fbm5(cp*1.6);",
"  c = mix(c, c*0.55 + vec3(0.03,0.04,0.05), smoothstep(0.42, 0.78, cl)*smoothstep(0., 0.25, y));",
"  float s = max(dot(d, L), 0.);",
"  c += vec3(1.0,0.62,0.36)*pow(s, 6.)*0.34 + vec3(1.0,0.82,0.62)*pow(s, 90.)*0.9;",
"  return c;",
"}",
"void main(){",
"  vec2 uv = (gl_FragCoord.xy - 0.5*uRes) / uRes.y;",
"  vec3 ro = vec3(uMouse.x*0.8, 1.9 + uMouse.y*0.3, 0.0);",
"  vec3 rd = normalize(vec3(uv.x + uMouse.x*0.05, uv.y + 0.21 + uMouse.y*0.04, 0.95));",
"  float t = 0.35, minGap = 1e3; bool hit = false;",
"  for(int i=0;i<150;i++){",
"    vec3 p = ro + rd*t; float g = p.y - hM(p.xz);",
"    minGap = min(minGap, g/t);",
"    if(g < 0.012*t){ hit = true; break; }",
"    t += g*0.34 + 0.012*t;",
"    if(t > 110.) break;",
"  }",
"  vec3 col;",
"  if(hit){",
"    float a = t-0.9, b = t;",
"    for(int j=0;j<5;j++){ float m=0.5*(a+b); vec3 q=ro+rd*m; if(q.y > hM(q.xz)) a=m; else b=m; }",
"    t = 0.5*(a+b);",
"    vec3 p = ro + rd*t;",
"    float e = clamp(0.04*t, 0.03, 0.5);",
"    float h0 = hF(p.xz);",
"    vec3 n = normalize(vec3(h0 - hF(p.xz+vec2(e,0.)), e, h0 - hF(p.xz+vec2(0.,e))));",
"    vec3 V = -rd;",
"    float hf = clamp(p.y/11.5, 0., 1.);",
"    vec2 tc = mix(p.xz, vec2(p.x, p.y*1.7 + p.z*0.15), clamp(1.0 - n.y*1.15, 0., 1.));",
"    float mud = fbm5(tc*vec2(0.5,0.5) + vec2(0., uTime*0.4));",
"    vec3 deep = vec3(0.006,0.048,0.066), shal = vec3(0.04,0.30,0.32), silt = vec3(0.14,0.13,0.07);",
"    vec3 base = mix(deep, shal, smoothstep(0.05, 1.0, hf));",
"    base = mix(base, silt, 0.12*smoothstep(0.35, 0.8, mud)*(1.0-hf*0.6));",
"    float diff = clamp(dot(n, L)*0.5 + 0.5, 0., 1.);",
"    float amb = 0.30 + 0.70*clamp(n.y*0.6 + 0.4, 0., 1.);",
"    vec3 c = base*(0.30 + 0.9*diff*diff)*amb;",
"    float thin = smoothstep(0.30, 1.0, hf);",
"    float sss = pow(clamp(dot(rd, L), 0., 1.), 2.2)*thin;",
"    c += vec3(0.08,0.85,0.70)*sss*1.7 + vec3(0.04,0.35,0.34)*pow(1.0-abs(n.z), 2.)*thin*0.5;",
"    float F = 0.03 + 0.97*pow(1.0 - max(dot(n, V), 0.), 5.);",
"    vec3 r = reflect(rd, n); r.y = abs(r.y);",
"    c += sky(r)*vec3(0.75,0.9,1.0)*F*0.42;",
"    c += vec3(1.0,0.78,0.55)*pow(max(dot(r, L), 0.), 90.)*1.6;",
"    float crest = smoothstep(0.62, 0.96, hf + 0.30*(fbm5(tc*vec2(1.1,0.9) + vec2(0., uTime*0.8)) - 0.5));",
"    float steep = smoothstep(0.35, 0.85, 1.0 - n.y);",
"    float lace = smoothstep(0.58, 0.82, fbm5(tc*vec2(2.2,2.0) + vec2(0., uTime*1.1)));",
"    float foam = clamp(crest*0.95 + steep*lace*0.20*(0.4+hf) + lace*smoothstep(-0.4,0.3,chop3(p.xz))*0.30*(1.0-hf)*smoothstep(0.55,0.9,n.y), 0., 1.);",
"    vec3 fc = vec3(0.86,0.95,0.95)*(0.55 + 0.55*diff + 0.4*sss) + vec3(0.1,0.25,0.2)*(1.0-foam)*0.0;",
"    c = mix(c, fc, foam);",
"    vec3 fog = sky(normalize(vec3(rd.x, 0.02, rd.z)))*0.55;",
"    c = mix(c, fog, 1.0 - exp(-t*0.0085));",
"    col = c;",
"  } else {",
"    col = sky(rd);",
"    float halo = exp(-max(minGap, 0.)*42.);",
"    float speck = smoothstep(0.50, 0.78, fbm5(uv*vec2(40.,40.) + vec2(uTime*0.6, uTime*0.3)));",
"    float mist  = fbm3(uv*vec2(5.,3.) + vec2(uTime*0.08, 0.));",
"    col = mix(col, vec3(0.95,0.98,1.0)*(0.7+0.5*smoothstep(0.,1.,dot(rd,L))), clamp(halo*(speck*0.75 + mist*0.35), 0., 0.9));",
"  }",
"  col = 1.0 - exp(-col*1.25);",
"  col = pow(col, vec3(0.4545));",
"  col += (hash(gl_FragCoord.xy + uTime) - 0.5)/255.;",
"  gl_FragColor = vec4(col, 1.0);",
"}"
  ].join("\n");

  var gl = canvas.getContext("webgl", { antialias: false, alpha: false, powerPreference: "high-performance" }) ||
           canvas.getContext("experimental-webgl");
  var prog, uni = {};
  function sh(type, src) {
    var s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { console.warn(gl.getShaderInfoLog(s)); return null; }
    return s;
  }
  function fallback() { document.body.classList.add("no-gl"); canvas.style.display = "none"; }
  if (!gl) { fallback(); }
  else {
    var vs = sh(gl.VERTEX_SHADER, VERT), fs = sh(gl.FRAGMENT_SHADER, FRAG);
    prog = vs && fs ? gl.createProgram() : null;
    if (!prog) { fallback(); }
    else {
      gl.attachShader(prog, vs); gl.attachShader(prog, fs); gl.linkProgram(prog);
      if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) { console.warn(gl.getProgramInfoLog(prog)); fallback(); prog = null; }
    }
  }
  if (prog) {
    gl.useProgram(prog);
    var buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
    var loc = gl.getAttribLocation(prog, "a"); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    ["uRes", "uTime", "uFront", "uMouse"].forEach(function (n) { uni[n] = gl.getUniformLocation(prog, n); });

    var scale = Math.min(window.devicePixelRatio || 1, 1.5) * 0.7;   // render below native size: the sea is soft, the text stays sharp
    var minScale = 0.32;
    function resize() {
      var w = Math.max(2, Math.floor(innerWidth * scale)), h = Math.max(2, Math.floor(innerHeight * scale));
      if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; gl.viewport(0, 0, w, h); }
    }
    addEventListener("resize", resize); resize();

    var mx = 0, my = 0, tx = 0, ty = 0;
    addEventListener("pointermove", function (e) { tx = e.clientX / innerWidth - 0.5; ty = 0.5 - e.clientY / innerHeight; }, { passive: true });

    var surge = 0, surging = false, surgeStart = 0;
    var t0 = performance.now(), last = t0, acc = 0, frames = 0, tuned = false;
    var timeScale = reduce ? 0.2 : 1;
    function ease(x) { return x < 0.5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3) / 2; }

    function frame(now) {
      var dt = now - last; last = now;
      if (!tuned && dt < 500) {                       // adapt resolution to the device in the first ~40 frames
        acc += dt; frames++;
        if (frames === 40) {
          tuned = true; var avg = acc / frames;
          if (avg > 42 && scale > minScale) { scale = Math.max(minScale, scale * Math.sqrt(30 / avg)); resize(); }
        }
      }
      mx += (tx - mx) * 0.04; my += (ty - my) * 0.04;
      var time = (now - t0) / 1000 * timeScale;
      var front = 13.0 + Math.sin(time * 0.22) * 1.1;
      if (surging) {
        surge = Math.min(1, (now - surgeStart) / 1500);
        front -= 19 * ease(surge);
        flash.style.opacity = String(Math.max(0, (surge - 0.62) / 0.38));
      }
      gl.uniform2f(uni.uRes, canvas.width, canvas.height);
      gl.uniform1f(uni.uTime, time);
      gl.uniform1f(uni.uFront, front);
      gl.uniform2f(uni.uMouse, mx, my);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(function (n) { last = n; frame(n); });

    link.addEventListener("click", function (e) {
      if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      if (reduce || surging) return;                  // plain navigation
      e.preventDefault(); surging = true; surgeStart = performance.now();
      setTimeout(function () { location.href = link.href; }, 1500);
    });
  }
})();
</script>
</body>
</html>
