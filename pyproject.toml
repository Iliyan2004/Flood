[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sailab-client"
version = "0.2.0"
description = "Thin client for the SAILAB flood-intelligence server: call its simulations from another project without copying the pipeline."
requires-python = ">=3.9"
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["sailab_client*"]
