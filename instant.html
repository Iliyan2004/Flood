<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SAILAB Instant</title>
<meta name="description" content="Pick a place in Pakistan and a rain scenario; see where flood water collects, on the map, in about a second.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100,400;100,600;100,800&family=Archivo+Narrow:wght@500;600&display=swap">
<link href="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.css" rel="stylesheet">
<link href="https://unpkg.com/@mapbox/mapbox-gl-draw@1.4.3/dist/mapbox-gl-draw.css" rel="stylesheet">
<style>
  :root {
    --ink: #eaf6f5; --muted: #9bbcbe; --aqua: #55e6da; --aqua-deep: #14a8a0; --bg: #05100f;
    --glass: rgba(6, 22, 24, .82); --line: rgba(85, 230, 218, .22); --warn: #f0b04a;
    --display: "Archivo", "Helvetica Neue", Arial, sans-serif; --text: "Archivo Narrow", "Arial Narrow", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font-family: var(--text); font-size: 15px; overflow: hidden; }
  #map { position: fixed; inset: 0; }
  .glass { background: var(--glass); -webkit-backdrop-filter: blur(12px) saturate(1.3); backdrop-filter: blur(12px) saturate(1.3); border: 1px solid var(--line); box-shadow: 0 10px 36px rgba(0, 0, 0, .45); }

  /* top bar */
  #bar { position: fixed; z-index: 10; top: 10px; left: 10px; right: 10px; display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 14px; }
  .brand { font-family: var(--display); font-weight: 800; font-stretch: 110%; letter-spacing: .12em; text-decoration: none; color: var(--ink); padding: 0 6px; }
  .pill { font-size: .72rem; letter-spacing: .16em; text-transform: uppercase; color: #03161a; background: var(--aqua); border-radius: 999px; padding: 3px 10px; font-weight: 600; }
  .searchbox { position: relative; flex: 1; min-width: 120px; max-width: 460px; }
  input[type=text], input[type=number], select { width: 100%; background: rgba(2, 10, 11, .7); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font: inherit; }
  input[type=range] { width: 100%; accent-color: var(--aqua); }
  :focus-visible { outline: 2px solid var(--aqua); outline-offset: 2px; }
  .btn { display: inline-flex; align-items: center; gap: 6px; background: transparent; color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 7px 12px; font: inherit; letter-spacing: .04em; cursor: pointer; text-decoration: none; white-space: nowrap; }
  .btn:hover { border-color: var(--aqua); color: var(--aqua); }
  .btn.on { background: var(--aqua); color: #03161a; border-color: var(--aqua); }
  .btn.primary { background: linear-gradient(135deg, var(--aqua), var(--aqua-deep)); color: #03161a; border: 0; font-family: var(--display); font-weight: 800; letter-spacing: .1em; text-transform: uppercase; font-size: .82rem; }
  .spacer { margin-left: auto; display: flex; gap: 8px; }
  .hits { position: absolute; z-index: 20; top: calc(100% + 6px); left: 0; right: 0; background: #071819; border: 1px solid var(--line); border-radius: 12px; max-height: 300px; overflow-y: auto; display: none; }
  .hits button { display: block; width: 100%; text-align: left; background: none; border: 0; color: var(--ink); padding: 8px 12px; font: inherit; cursor: pointer; }
  .hits button small { display: block; color: var(--muted); }
  .hits button:hover, .hits button:focus-visible { background: rgba(85, 230, 218, .12); outline: none; }
  .hits .grp { padding: 6px 12px 2px; font-size: .7rem; letter-spacing: .16em; text-transform: uppercase; color: var(--aqua); }

  /* welcome */
  #welcome { position: fixed; z-index: 30; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(2, 8, 9, .55); -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px); }
  #welcome .card { position: relative; width: min(480px, 100%); display: grid; grid-template-columns: 1fr; border-radius: 22px; overflow: hidden; }
  #welcome .left { padding: 30px; background: linear-gradient(160deg, #0b3a3c 0%, #0a2a30 60%, #06161b 100%); }
  #welcome .left h1 { margin: 0 0 18px; font-family: var(--display); font-weight: 900; font-stretch: 110%; letter-spacing: .08em; font-size: 2rem; }
  #welcome .left li { list-style: none; margin: 0 0 14px; line-height: 1.4; color: rgba(234, 246, 245, .88); }
  #welcome .left li b { display: block; color: var(--ink); font-size: 1.05rem; }
  #welcome ul { padding: 0; margin: 0; }
  #welcome .right { padding: 30px; background: #f4fbfb; color: #0a1f22; }
  #welcome .right h2 { margin: 0 0 16px; font-family: var(--display); font-weight: 800; font-size: 1.7rem; line-height: 1.15; }
  #welcome .right h2 em { font-style: normal; color: #0d8f88; }
  #welcome label { display: block; font-weight: 600; margin: 10px 0 6px; }
  #welcome input[type=text] { background: #fff; color: #0a1f22; border: 1px solid #b9d6d6; }
  #welcome .hits { background: #fff; border-color: #b9d6d6; }
  #welcome .hits button { color: #0a1f22; } #welcome .hits button small { color: #5b7b7d; }
  #welcome .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { background: #fff; color: #0a1f22; border: 1.5px solid #b9d6d6; border-radius: 10px; padding: 8px 12px; font: inherit; font-weight: 600; cursor: pointer; }
  .chip.on { border-color: #0d8f88; background: #e1f6f4; color: #086660; }
  #welcome .go { width: 100%; margin-top: 16px; padding: 12px; border-radius: 12px; font-size: .95rem; }
  #welcome .close { position: absolute; z-index: 2; top: 12px; right: 12px; background: #fff; color: #0a1f22; border: 1px solid #b9d6d6; width: 34px; height: 34px; border-radius: 10px; cursor: pointer; font-size: 1.1rem; }
  #welcome .fine { margin-top: 14px; color: #5b7b7d; font-size: .85rem; line-height: 1.4; }

  /* result panel + legend */
  #panel { position: fixed; z-index: 10; left: 10px; bottom: 28px; width: min(360px, calc(100% - 20px)); border-radius: 16px; padding: 14px 16px; display: none; }
  #panel h3 { margin: 0 0 2px; font-family: var(--display); font-size: 1.05rem; font-weight: 800; letter-spacing: .04em; }
  #panel .sub { color: var(--muted); font-size: .86rem; margin-bottom: 8px; }
  #panel .chips { display: flex; gap: 6px; margin: 8px 0; }
  #panel .chip { background: transparent; color: var(--ink); border: 1px solid var(--line); padding: 5px 10px; font-weight: 500; }
  #panel .chip.on { background: var(--aqua); color: #03161a; border-color: var(--aqua); }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 6px 0; }
  .row label { color: var(--muted); font-size: .86rem; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0 6px; }
  .stat { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: rgba(2, 10, 11, .55); }
  .stat span { display: block; font-size: .7rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .stat strong { font-family: var(--display); font-size: 1.35rem; font-weight: 800; font-variant-numeric: tabular-nums; }
  #panel p { margin: 6px 0 0; font-size: .82rem; line-height: 1.4; color: var(--muted); }
  #panel p.err { color: #ff8d7a; }
  #legend { position: fixed; z-index: 10; right: 10px; bottom: 28px; border-radius: 12px; padding: 10px 12px; display: none; }
  #legend h4 { margin: 0 0 6px; font-family: var(--display); font-size: .78rem; letter-spacing: .1em; text-transform: uppercase; }
  #legend div { display: flex; align-items: center; gap: 8px; font-size: .82rem; margin: 2px 0; font-variant-numeric: tabular-nums; }
  #legend i { width: 16px; height: 12px; border-radius: 3px; display: inline-block; }
  #busy { position: fixed; z-index: 12; top: 70px; left: 50%; transform: translateX(-50%); padding: 7px 16px; border-radius: 999px; display: none; font-size: .9rem; }
  @media (max-width: 760px) {
    #welcome .card { grid-template-columns: 1fr; } #welcome .left { display: none; }
    #bar .brand + .pill { display: none; } .btn .lbl { display: none; }
    #legend { bottom: auto; top: 64px; }
  }
  /* light theme (shared choice with /app via localStorage "sailabTheme") */
  :root[data-theme="light"] {
    --ink: #10222B; --muted: #4F6A74; --aqua: #0C8E98; --aqua-deep: #0A7A84; --bg: #EAF0F4;
    --glass: rgba(255, 255, 255, .88); --line: rgba(12, 90, 100, .25); --warn: #B8730F;
  }
  :root[data-theme="light"] .glass { box-shadow: 0 10px 30px rgba(16, 34, 43, .18); }
  :root[data-theme="light"] input[type=text], :root[data-theme="light"] input[type=number], :root[data-theme="light"] select { background: #fff; }
  :root[data-theme="light"] .pill, :root[data-theme="light"] .btn.on, :root[data-theme="light"] .btn.primary, :root[data-theme="light"] #panel .chip.on { color: #fff; }
  :root[data-theme="light"] .hits { background: #fff; }
  :root[data-theme="light"] .stat { background: rgba(255, 255, 255, .7); }
  :root[data-theme="light"] #panel p.err { color: #C93A3D; }
  :root[data-theme="light"] #welcome { background: rgba(234, 240, 244, .6); }
  #themeToggle { width: 36px; padding: 7px 0; justify-content: center; font-size: 1rem; line-height: 1; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  .dg { margin-top:10px; padding:10px 12px; border:1px solid var(--line); border-radius:12px; }
  .dg-title { font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-bottom:6px; }
  .dg-svg { width:100%; height:auto; display:block; }
  .dg-water { fill:var(--accent, var(--aqua)); opacity:.42; }
  .dg-surface { stroke:var(--accent, var(--aqua)); stroke-width:2; }
  .dg-person { fill:var(--ink); opacity:.78; }
  .dg-tick { stroke:var(--muted); stroke-width:1; }
  .dg-lbl { fill:var(--muted); font-size:9px; font-family:ui-monospace,Menlo,monospace; }
  .dg-ground { fill:var(--muted); opacity:.6; }
  .dg-row { display:flex; align-items:center; gap:8px; margin-top:6px; font-size:12px; color:var(--muted); }
  .dg-row input[type=range] { flex:1; width:auto; }
  .dg-row b { color:var(--ink); min-width:48px; text-align:right; font-variant-numeric:tabular-nums; }
  .dg-msg { margin-top:8px; padding:8px 10px; border-left:3px solid var(--accent, var(--aqua)); border-radius:8px; background:rgba(127,127,127,.12); font-size:13px; font-weight:600; color:var(--ink); }
  .dg-note { margin-top:6px; font-size:11px; color:var(--muted); line-height:1.4; }
</style>
</head>
<body>
<div id="map"></div>

<div id="bar" class="glass">
  <a class="brand" href="/">SAILAB</a><span class="pill">Instant</span>
  <div class="searchbox">
    <input type="text" id="barSearch" placeholder="Search a place or tehsil in Pakistan" autocomplete="off" aria-label="Search a place or tehsil">
    <div class="hits" id="barHits"></div>
  </div>
  <div class="spacer">
    <button class="btn" id="drawBtn" title="Draw your own area on the map">Draw area</button>
    <button class="btn" id="themeToggle" title="Switch between dark and light mode" aria-label="Switch between dark and light mode">&#9680;</button>
    <button class="btn" id="threeD" title="Tilt the map and show terrain relief">3D</button>
    <a class="btn" href="/app">Physics &rarr;</a>
  </div>
</div>

<div id="busy" class="glass">Working...</div>

<div id="welcome" role="dialog" aria-modal="true" aria-labelledby="wtitle">
  <div class="card glass">
    <button class="close" id="wclose" aria-label="Close and explore the map">&times;</button>
    <div class="right">
      <h2 id="wtitle">Get flood information<br>for <em>your area</em></h2>
      <label for="wSearch">Enter your location</label>
      <div class="searchbox" style="max-width:none;"><input type="text" id="wSearch" placeholder="Search a place or tehsil, e.g. Islamabad I-8" autocomplete="off"><div class="hits" id="wHits"></div></div>
      <label>Choose a scenario</label>
      <div class="chips" id="wChips"><button class="chip on" data-s="moderate">Moderate rain</button><button class="chip" data-s="extreme">Extreme rain</button></div>
      <button class="btn primary go" id="wGo">Get flood information</button>
    </div>
  </div>
</div>

<div id="panel" class="glass">
  <h3 id="pTitle">Your area</h3>
  <div class="sub" id="pSub"></div>
  <div class="chips" id="pChips"><button class="chip" data-s="moderate">Moderate rain</button><button class="chip" data-s="extreme">Extreme rain</button><button class="chip" data-s="custom">Custom</button></div>
  <div class="row"><label for="rain">Rain intensity</label><b><span id="rainVal">15</span> mm/hr</b></div>
  <input type="range" id="rain" min="1" max="100" step="0.5" value="15" aria-label="Rain intensity in millimetres per hour">
  <div class="row"><label for="dur">Storm length</label>
    <select id="dur" style="width:auto;"><option value="1">1 hour</option><option value="3" selected>3 hours</option><option value="6">6 hours</option><option value="12">12 hours</option><option value="24">24 hours</option></select></div>
  <div class="stats">
    <div class="stat"><span>Flooded area</span><strong id="sArea">&ndash;</strong></div>
    <div class="stat"><span>Deepest water</span><strong id="sDepth">&ndash;</strong></div>
  </div>
  <div id="depthGuide"></div>
  <label id="learnedRow" style="display:flex;gap:8px;align-items:center;font-size:12px;margin:6px 0;cursor:pointer"><input type="checkbox" id="learned"> Learned model (beta)</label>
  <p id="sNote"></p>
</div>

<div id="legend" class="glass">
  <h4>Flood depth (m)</h4>
  <div><i style="background:#b0e0f5"></i>0.05</div><div><i style="background:#8cc8f0"></i>0.1</div><div><i style="background:#56a6e2"></i>0.25</div>
  <div><i style="background:#227ecc"></i>0.5</div><div><i style="background:#105aaa"></i>1</div><div><i style="background:#0a3878"></i>2</div><div><i style="background:#061e4e"></i>5</div>
</div>

<script src="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.js"></script>
<script src="https://unpkg.com/@mapbox/mapbox-gl-draw@1.4.3/dist/mapbox-gl-draw.js"></script>
<script>
(function () {
  var root = document.documentElement;
  function apply(t) { root.setAttribute('data-theme', t); var b = document.getElementById('themeToggle'); if (b) b.innerHTML = t === 'light' ? '&#9790;' : '&#9728;'; }
  var t = 'dark'; try { t = localStorage.getItem('sailabTheme') || 'dark'; } catch (e) {}
  apply(t);
  document.addEventListener('DOMContentLoaded', function () {
    apply(root.getAttribute('data-theme'));
    document.getElementById('themeToggle').addEventListener('click', function () {
      var n = root.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
      apply(n); try { localStorage.setItem('sailabTheme', n); } catch (e) {}
    });
  });
})();
</script>
<script>
"use strict";
const MAPBOX_TOKEN = __MAPBOX_TOKEN__;
mapboxgl.accessToken = MAPBOX_TOKEN;
const $ = id => document.getElementById(id);
const BASE = 'mapbox://styles/mapbox/satellite-streets-v12';
let geom = null, label = '', scen = null, scenKey = 'moderate', areaToken = 0, ovToken = 0, ovTimer = null, lastOv = null, is3D = false;

const map = new mapboxgl.Map({ container: 'map', style: BASE, center: [69.3, 30.4], zoom: 4.8, preserveDrawingBuffer: true });
map.addControl(new mapboxgl.NavigationControl({ visualizePitch: true }), 'bottom-right');
const draw = new MapboxDraw({ displayControlsDefault: false });
map.addControl(draw);

function busy(msg) { const b = $('busy'); if (msg) { b.textContent = msg; b.style.display = 'block'; } else b.style.display = 'none'; }
const fmtArea = v => v >= 100 ? v.toFixed(0) : v >= 10 ? v.toFixed(1) : v.toFixed(2);
const boxAround = (lon, lat, km) => { const dl = km / 2 / 111.32, dn = dl / Math.cos(lat * Math.PI / 180);
  return { type: 'Polygon', coordinates: [[[lon - dn, lat - dl], [lon + dn, lat - dl], [lon + dn, lat + dl], [lon - dn, lat + dl], [lon - dn, lat - dl]]] }; };
const boundsOf = g => { const b = new mapboxgl.LngLatBounds(); (g.type === 'Polygon' ? [g.coordinates] : g.coordinates).forEach(p => p[0].forEach(c => b.extend(c))); return b; };

// ---------- search (places + tehsils) ----------
function wireSearch(input, hitsEl, onPick) {
  let t = null;
  input.addEventListener('input', () => {
    clearTimeout(t); const q = input.value.trim();
    if (q.length < 2) { hitsEl.style.display = 'none'; return; }
    t = setTimeout(async () => {
      const [teh, geo] = await Promise.all([
        fetch('/tehsils/search?q=' + encodeURIComponent(q)).then(r => r.json()).catch(() => ({})),
        fetch('https://api.mapbox.com/geocoding/v5/mapbox.places/' + encodeURIComponent(q + ', Pakistan') + '.json?access_token=' + encodeURIComponent(MAPBOX_TOKEN) +
              '&limit=5&country=pk&bbox=60.87,23.63,77.84,37.13').then(r => r.json()).catch(() => ({})),
      ]);
      hitsEl.innerHTML = '';
      const add = (txt, sub, fn) => { const b = document.createElement('button'); b.innerHTML = txt + (sub ? '<small>' + sub + '</small>' : ''); b.onclick = () => { hitsEl.style.display = 'none'; fn(); }; hitsEl.appendChild(b); };
      const places = (geo.features || []);
      if (places.length) { const g = document.createElement('div'); g.className = 'grp'; g.textContent = 'Places'; hitsEl.appendChild(g);
        places.forEach(f => add(f.text, f.place_name, () => onPick({ kind: 'place', name: f.place_name, lon: f.center[0], lat: f.center[1] }))); }
      const th = (teh.results || []).slice(0, 4);
      if (th.length) { const g = document.createElement('div'); g.className = 'grp'; g.textContent = 'Tehsils (whole area)'; hitsEl.appendChild(g);
        th.forEach(x => add(x.name, [x.district, x.province].filter(Boolean).join(', '), () => onPick({ kind: 'tehsil', id: x.id, name: x.name + ', ' + (x.district || '') }))); }
      if (!hitsEl.children.length) add('No match', '', () => {});
      hitsEl.style.display = 'block';
    }, 250);
  });
  document.addEventListener('click', e => { if (!hitsEl.contains(e.target) && e.target !== input) hitsEl.style.display = 'none'; });
}
let pendingPick = null;
wireSearch($('wSearch'), $('wHits'), p => { pendingPick = p; $('wSearch').value = p.name; });
wireSearch($('barSearch'), $('barHits'), p => { $('barSearch').value = p.name; usePick(p); });

async function usePick(p) {
  if (p.kind === 'tehsil') {
    busy('Working...');
    const d = await fetch('/tehsils/' + p.id).then(r => r.json()).catch(() => null);
    busy(); if (!d || !d.geometry) return;
    setArea(d.geometry, p.name);
  } else setArea(boxAround(p.lon, p.lat, 6), p.name);
}

// ---------- welcome ----------
let wScen = 'moderate';
$('wChips').addEventListener('click', e => { const b = e.target.closest('.chip'); if (!b) return; wScen = b.dataset.s; scenKey = wScen;
  document.querySelectorAll('#wChips .chip').forEach(x => x.classList.toggle('on', x === b)); });
$('wclose').onclick = () => { $('welcome').style.display = 'none'; };
$('wGo').onclick = () => { if (!pendingPick) { $('wSearch').focus(); $('wSearch').placeholder = 'Pick a place from the list first'; return; } $('welcome').style.display = 'none'; usePick(pendingPick); };
$('wSearch').addEventListener('keydown', e => { if (e.key === 'Enter') $('wGo').click(); });

// ---------- area ----------
async function setArea(g, name) {
  const my = ++areaToken; geom = g; label = name || 'Your area'; lastOv = null; clearOverlay();
  draw.getAll().features.forEach(f => draw.delete(f.id));
  map.fitBounds(boundsOf(g), { padding: { top: 90, bottom: 60, left: 380, right: 120 }, duration: 1400, pitch: is3D ? 60 : 0 });
  $('panel').style.display = 'block'; $('legend').style.display = 'block';
  $('pTitle').textContent = label; $('pSub').textContent = ''; $('sArea').textContent = '–'; $('sDepth').textContent = '–';
  busy('Working...');
  try {
    const sc = await fetch('/area/instant-scenarios', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ geometry: g }) }).then(r => r.json());
    if (my !== areaToken) return;
    scen = sc; applyScenario(scenKey === 'custom' ? 'moderate' : scenKey, false);
    await refreshOverlay(my);
  } catch (e) { $('sNote').className = 'err'; $('sNote').textContent = 'Failed: ' + e; busy(); }
}
function applyScenario(k, refresh) {
  scenKey = k; document.querySelectorAll('#pChips .chip').forEach(x => x.classList.toggle('on', x.dataset.s === k));
  if (k !== 'custom' && scen) { const v = k === 'extreme' ? scen.extreme_mm_hr : scen.moderate_mm_hr; $('rain').value = Math.min(100, v); $('rainVal').textContent = v; $('dur').value = String(scen.duration_hr); }
  if (refresh) scheduleOverlay(0);
}
$('pChips').addEventListener('click', e => { const b = e.target.closest('.chip'); if (b) applyScenario(b.dataset.s, true); });
$('rain').addEventListener('input', () => { $('rainVal').textContent = $('rain').value; applyScenario('custom', false); scheduleOverlay(350); });
$('dur').addEventListener('change', () => { applyScenario('custom', false); scheduleOverlay(0); });

// ---------- flood overlay on the main map ----------
function clearOverlay() { if (map.getLayer('flood')) map.removeLayer('flood'); if (map.getSource('flood')) map.removeSource('flood'); }
function paintOverlay(ov) {
  clearOverlay();
  map.addSource('flood', { type: 'image', url: ov.image, coordinates: ov.coordinates });
  map.addLayer({ id: 'flood', type: 'raster', source: 'flood', paint: { 'raster-opacity': 0.92, 'raster-resampling': 'linear', 'raster-fade-duration': 150 } });
}
map.on('style.load', () => { if (lastOv) paintOverlay(lastOv); if (is3D) enableTerrain(); });
function scheduleOverlay(d) { clearTimeout(ovTimer); const my = areaToken; ovTimer = setTimeout(() => refreshOverlay(my), d); }
async function refreshOverlay(my) {
  if (!geom) return; const tok = ++ovToken;
  busy('Calculating the flood...');
  try {
    const ov = await fetch('/area/instant-flood-overlay', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ geometry: geom, rain_mm_hr: parseFloat($('rain').value), duration_hr: parseFloat($('dur').value), method: $('learned').checked ? 'learned' : 'terrain' }) }).then(r => r.json());
    if (tok !== ovToken || my !== areaToken) return;
    busy();
    if (ov.error) { $('pSub').textContent = ''; $('sNote').className = 'err'; $('sNote').textContent = ov.error; return; }
    lastOv = ov; paintOverlay(ov);
    $('pSub').textContent = fmtArea(ov.area_km2) + ' km²';
    $('sArea').textContent = fmtArea(ov.flooded_area_km2) + ' km²'; $('sDepth').textContent = ov.max_depth_m.toFixed(2) + ' m';
    $('sNote').className = '';
    renderDepthGuide('depthGuide', ov.max_depth_m);
    $('sNote').textContent = '';
  } catch (e) { busy(); $('sNote').className = 'err'; $('sNote').textContent = 'Failed: ' + e; }
}

// ---------- 3D, draw, upload-free controls ----------
function enableTerrain() {
  if (!map.getSource('dem')) map.addSource('dem', { type: 'raster-dem', url: 'mapbox://mapbox.mapbox-terrain-dem-v1', tileSize: 512, maxzoom: 14 });
  map.setTerrain({ source: 'dem', exaggeration: 1.5 });
}
$('threeD').onclick = () => {
  is3D = !is3D; $('threeD').classList.toggle('on', is3D);
  if (is3D) { enableTerrain(); map.easeTo({ pitch: 62, duration: 900 }); } else { map.setTerrain(null); map.easeTo({ pitch: 0, bearing: 0, duration: 700 }); }
};
$('learned').onchange = () => { if (geom) scheduleOverlay(0); };
$('drawBtn').onclick = () => { $('welcome').style.display = 'none'; draw.changeMode('draw_polygon'); busy('Click the map to outline your area; double-click to finish.'); };
const onDraw = () => {
  busy();
  const polys = draw.getAll().features.filter(f => f.geometry.type === 'Polygon'); if (!polys.length) return;
  const last = polys[polys.length - 1]; polys.slice(0, -1).forEach(f => draw.delete(f.id));
  clearTimeout(onDraw.t); onDraw.t = setTimeout(() => setAreaKeepDrawing(last.geometry), 400);
};
async function setAreaKeepDrawing(g) {   // keep the drawn outline on the map
  const keep = JSON.parse(JSON.stringify(g)); await setArea(g, 'Drawn area');
  draw.add({ type: 'Feature', properties: {}, geometry: keep });
}
map.on('draw.create', onDraw); map.on('draw.update', onDraw);

// deep links: /instant#tehsil=158 or /instant#lat=33.67&lon=73.07
map.on('load', async () => {
  const h = location.hash;
  const t = /tehsil=(\d+)/.exec(h), la = /lat=([-\d.]+)/.exec(h), lo = /lon=([-\d.]+)/.exec(h);
  if (t) { $('welcome').style.display = 'none'; usePick({ kind: 'tehsil', id: t[1], name: 'Tehsil ' + t[1] }); }
  else if (la && lo) { $('welcome').style.display = 'none'; setArea(boxAround(parseFloat(lo[1]), parseFloat(la[1]), 6), 'Selected place'); }
});
var DEPTH_MARKS = [[0.1, "ankle"], [0.5, "knee"], [1, "waist"], [1.35, "chest"], [1.7, "head"]];
function depthMessage(d) {
  if (d < 0.1) return "Below ankle height. Watch for open drains and moving water.";
  if (d < 0.5) return "Ankle to knee height. Walking gets difficult. Do not drive through it.";
  if (d < 1) return "Knee to waist height. Fast water at this depth can knock an adult over. Avoid it.";
  if (d < 1.35) return "Waist to chest height. Dangerous to wade through. Move to higher ground.";
  if (d < 1.7) return "Chest height. Dangerous. Move to an upper floor or higher ground.";
  return "Over head height for most adults. Move to the upper floor or higher ground.";
}
function depthGuideSvg(d) {
  var S = 64, H = 150, W = 300, g = H - 14, dd = Math.min(Math.max(d, 0), 2.1), top = g - dd * S, px = 100;
  var s = '<svg class="dg-svg" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Flood depth compared with a standing adult">';
  s += '<rect class="dg-water" x="0" y="' + top + '" width="' + W + '" height="' + (g - top) + '"/>';
  s += '<g class="dg-person"><rect x="' + (px - 10) + '" y="' + (g - 0.85 * S) + '" width="8" height="' + (0.85 * S) + '" rx="2"/>' +
       '<rect x="' + (px + 2) + '" y="' + (g - 0.85 * S) + '" width="8" height="' + (0.85 * S) + '" rx="2"/>' +
       '<rect x="' + (px - 14) + '" y="' + (g - 1.5 * S) + '" width="28" height="' + (0.7 * S) + '" rx="6"/>' +
       '<circle cx="' + px + '" cy="' + (g - 1.62 * S) + '" r="' + (0.12 * S) + '"/></g>';
  s += '<line class="dg-surface" x1="0" x2="' + W + '" y1="' + top + '" y2="' + top + '"/>';
  DEPTH_MARKS.forEach(function (m) {
    var y = g - m[0] * S;
    s += '<line class="dg-tick" x1="170" x2="190" y1="' + y + '" y2="' + y + '"/><text class="dg-lbl" x="195" y="' + (y + 3) + '">' + m[1] + ' ' + m[0] + ' m</text>';
  });
  s += '<rect class="dg-ground" x="0" y="' + g + '" width="' + W + '" height="3"/></svg>';
  return s;
}
function renderDepthGuide(elId, depth) {
  var el = document.getElementById(elId); if (!el) return;
  var d0 = Math.min(Math.max(+depth || 0, 0), 2.1);
  el.innerHTML = '<div class="dg"><div class="dg-title">What this depth means</div><div id="' + elId + '_svg">' + depthGuideSvg(d0) + '</div>' +
    '<div class="dg-row"><label for="' + elId + '_s">Depth</label><input type="range" id="' + elId + '_s" min="0" max="2.1" step="0.05" value="' + d0.toFixed(2) + '"><b id="' + elId + '_v">' + d0.toFixed(2) + ' m</b></div>' +
    '<div class="dg-msg" id="' + elId + '_m">' + depthMessage(d0) + '</div>' +
    '</div>';
  document.getElementById(elId + '_s').addEventListener('input', function (e) {
    var v = parseFloat(e.target.value);
    document.getElementById(elId + '_svg').innerHTML = depthGuideSvg(v);
    document.getElementById(elId + '_v').textContent = v.toFixed(2) + ' m';
    document.getElementById(elId + '_m').textContent = depthMessage(v);
  });
}
</script>
</body>
